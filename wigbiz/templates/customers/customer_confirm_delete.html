{% extends "base.html" %}
{% block title %}Deactivate Customer{% endblock %}

{% block content %}
<h1>Deactivate {{ customer.name }}?</h1>
<p>This will mark the customer as inactive. They won't appear in your customer list anymore.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, deactivate</button>
</form>
<a href="{% url 'customers:customer_detail' customer.pk %}">Cancel</a>
{% endblock %}
