{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sales Dashboard
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/dashboard.css' %}">

</head>

<body>

<header class="navbar">

    <div class="brand">
        WigBiz ERP
    </div>

    <div class="navbar-right">

        <span>
            {{ user.username }}
        </span>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <nav>

            <!-- MAIN NAVIGATION -->

            <a href="{% url 'dashboard:dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'sales:create_sale' %}">
                Sales
            </a>

            <a href="{% url 'customers:customer_list' %}">
                Customers
            </a>


            <!-- BOTTOM NAVIGATION -->

            <div class="bottom-links">

                <a href="{% url 'accounts:settings' %}">
                    ⚙ Settings
                </a>

                <a href="{% url 'accounts:logout' %}">
                    ⇥ Logout
                </a>

            </div>

        </nav>

    </aside>


    <main class="main-content">

        {% if messages %}

            {% for message in messages %}

                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        {% block content %}
        {% endblock %}

    </main>

</div>


<footer class="footer">

    <p>
        &copy; {% now "Y" %} WigBiz ERP.
    </p>

</footer>

</body>

</html>
