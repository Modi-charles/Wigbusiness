{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<div class="dashboard-panel">
    <form method="POST">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="error-message">
                <strong>Please fix the errors below:</strong>
                {{ form.errors }}
            </div>
        {% endif %}
        
        {{ form.as_p }}
        
        <div class="form-actions">
            <button class="btn-primary" type="submit">
                {% if 'Edit' in title %} Save Changes {% else %} Add User {% endif %}
            </button>
            <a class="btn-secondary" href="{% url 'accounts:user_list' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
