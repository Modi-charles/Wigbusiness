<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<style>
    *{
        margin: 0;
        padding:0;
    }
    body{
        background: rgb(1, 18, 53);
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    form{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 15px;
       
        border: 0 4px 8px rgb(6, 5, 5);
    }
</style>
<body>


<form method="POST">
<h2>Please Login</h2>

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
