{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="auth-card">

        <h1>Login</h1>

        {% if messages %}
        <div class="auth-messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div>
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autofocus
                    autocomplete="username"
                    required
                >
            </div>

            <div>
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Login</button>

        </form>

    </div>
</div>

{% endblock %}
