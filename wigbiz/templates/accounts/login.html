{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    <div>
        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <br>

    <div>
        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <br>

    <button type="submit">
        Login
    </button>

</form>

{% if messages %}

    {% for message in messages %}

        <p>
            {{ message }}
        </p>

    {% endfor %}

{% endif %}

{% endblock %}
