{% extends "base.html" %}

{% block title %}User{% endblock %}

{% block content %}

<h1>
    {% if user_account %}
        Edit User
    {% else %}
        Add User
    {% endif %}
</h1>

<form method="post">

    {% csrf_token %}

    {% if not user_account %}

    <div>
        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >
    </div>

    <br>

    <div>
        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >
    </div>

    <br>

    {% endif %}

    <div>
        <label>First Name</label>

        <input
            type="text"
            name="first_name"
            value="{{ user_account.first_name|default:'' }}"
        >
    </div>

    <br>

    <div>
        <label>Last Name</label>

        <input
            type="text"
            name="last_name"
            value="{{ user_account.last_name|default:'' }}"
        >
    </div>

    <br>

    <div>
        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user_account.email|default:'' }}"
        >
    </div>

    <br>

    <div>
        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ user_account.phone|default:'' }}"
        >
    </div>

    <br>

    <div>

        <label>Role</label>

        <select name="role">

            <option value="">
                -- Select Role --
            </option>

            {% for role in roles %}

            <option
                value="{{ role.id }}"
                {% if user_account.role_id == role.id %}
                    selected
                {% endif %}
            >

                {{ role.name }}

            </option>

            {% endfor %}

        </select>

    </div>

    <br>

    <button type="submit">
        Save
    </button>

</form>

{% endblock %}
